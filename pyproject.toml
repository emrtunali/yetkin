[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yetkin"
version = "0.1.0"
description = "Skill and knowledge extraction from job postings: a fine-tuned encoder and a QLoRA-tuned small LLM, compared on SkillSpan."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emir Tunali" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# training and inference; Colab already ships torch
train = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.33", "peft>=0.12", "huggingface_hub>=0.24", "sentencepiece>=0.2", "protobuf>=4"]
qlora = ["bitsandbytes>=0.43"]
track = ["wandb>=0.17"]
demo = ["gradio>=4.40"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
# generated from scripts/make_notebooks.py, which is linted
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
markers = ["slow: trains tiny models on CPU (minutes)"]

[tool.ruff.lint.per-file-ignores]
# cell sources of the Colab notebooks are kept as written
"scripts/make_notebooks.py" = ["E501"]
